[script://$SPLUNK_HOME/etc/apps/TA-kernel/bin/kernel_events.py]
interval = 300
index = main
sourcetype = kernel:status
source = status
disabled = 0
python.version = python3
python.required = 3.13

[script://$SPLUNK_HOME/etc/apps/TA-kernel/bin/kernel_metrics.py]
interval = 300
index = metrics
sourcetype = kernel:metrics
source = metrics
disabled = 0
python.version = python3
python.required = 3.13

[script://$SPLUNK_HOME/etc/apps/TA-kernel/bin/license_beacon.py]
interval = 3600
index = main
sourcetype = ta_license:status
source = ta_license:TA-kernel
disabled = 0
python.version = python3
python.required = 3.13
